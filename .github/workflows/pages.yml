name: Deploy studio website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'tools/check-site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            website
            tools
      - name: Check static site
        run: python3 tools/check-site.py
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload website only
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: website
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
