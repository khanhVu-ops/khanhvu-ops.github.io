<body>
    <div class="backdrop" aria-hidden="true"></div>

        <aside class="sidebar">
            <a class="brand" href="#/">

                        <linearGradient id="g-tri" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1fcaf0"/><stop offset="1" stop-color="#1263d4"/></linearGradient>
                        <linearGradient id="g-leg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a3b78"/><stop offset="1" stop-color="#0a8ac6"/></linearGradient>
                        <linearGradient id="g-vee" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14e8f8"/><stop offset="1" stop-color="#0a84ee"/></linearGradient>
                    </defs>
                    <path fill="url(#g-bar)" d="M260 280Q260 262 276 270L392 333Q404 341 404 358V606L270 734Q260 742 260 728Z"/>
                    <path fill="url(#g-arm)" d="M418 440Q418 428 428 420L540 315Q555 303 575 303H720Q732 305 724 316L430 596Q418 606 418 590Z"/>
                    <path fill="url(#g-tri)" d="M406 622L526 734Q532 741 522 741H273Q263 741 270 734Z"/>
                    <path fill="url(#g-leg)" d="M562 500Q572 492 582 502L822 731Q830 741 816 741H650Q620 741 600 720L478 592Q470 583 478 576Z"/>

                </svg>
                <span class="brand-text"><strong>KV Studio</strong><small>Marketing dashboard</small></span>
            </a>
            <nav class="nav" id="nav"></nav>
            <div class="sidebar-foot">
                <button class="icon-btn" id="theme" type="button" title="Đổi giao diện sáng/tối"></button>
                <button class="icon-btn" id="refresh" type="button" title="Đọc lại repo (R)"></button>
                <span class="sync" id="sync">—</span>
            </div>
        </aside>
        <main class="main" id="main" tabindex="-1">
            <div class="loading"><span class="spinner"></span>Đang đọc repo…</div>
        </main>
    </div>
    <div class="drawer-layer" id="drawer" hidden></div>
    <div class="modal-layer" id="modal" hidden></div>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <div class="tooltip" id="tooltip" hidden></div>
    <script src="app.js" type="module"></script>
</body>
</html>
